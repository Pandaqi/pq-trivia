<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #10232b;
        color: #f2f6f4;
        font:
          0.85rem/1.4 system-ui,
          sans-serif;
      }
      body {
        display: grid;
        grid-template-columns: 8rem 1fr;
        align-items: center;
        gap: 1rem;
        padding: 0.8rem 1rem;
        box-sizing: border-box;
      }
      canvas {
        width: 8rem;
        height: 8rem;
      }
      h2 {
        margin: 0 0 0.2rem;
        font-size: 0.95rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: #a9c6cf;
      }
    </style>
  </head>
  <body>
    <canvas id="face" width="240" height="240" aria-hidden="true"></canvas>
    <div>
      <h2 id="clock">--:--</h2>
      <p id="note">A sandboxed widget. No access to the page.</p>
    </div>
    <script>
      const parent = window.parent;
      const send = (type, payload) => {
        parent.postMessage({ type, payload }, "*");
      };
      const face = document.getElementById("face");
      const ctx = face.getContext("2d");
      const clock = document.getElementById("clock");
      const note = document.getElementById("note");
      let questionId = null;

      function draw() {
        const now = new Date();
        clock.textContent = now.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
        });
        const minutes = now.getMinutes();
        const tide = Math.round(
          50 + 42 * Math.sin((minutes / 60) * Math.PI * 2),
        );
        ctx.clearRect(0, 0, 240, 240);
        ctx.fillStyle = "#1b3a45";
        ctx.beginPath();
        ctx.arc(120, 120, 112, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#2f6b8a";
        ctx.lineWidth = 2;
        for (let step = 0; step < 12; step += 1) {
          const angle = (step / 12) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(120 + Math.cos(angle) * 94, 120 + Math.sin(angle) * 94);
          ctx.lineTo(120 + Math.cos(angle) * 106, 120 + Math.sin(angle) * 106);
          ctx.stroke();
        }
        ctx.strokeStyle = "#d9a441";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(120, 120);
        const hand = (minutes / 60) * Math.PI * 2 - Math.PI / 2;
        ctx.lineTo(120 + Math.cos(hand) * 72, 120 + Math.sin(hand) * 72);
        ctx.stroke();
        ctx.fillStyle = "#f2f6f4";
        ctx.beginPath();
        ctx.arc(120, 120, 7, 0, Math.PI * 2);
        ctx.fill();
        note.textContent = `Tide at ${tide}%. Question ${questionId ?? "?"}.`;
      }

      window.addEventListener("message", (event) => {
        const data = event.data;
        if (
          data === null ||
          typeof data !== "object" ||
          data.type !== "pq:init"
        ) {
          return;
        }
        questionId = data.payload?.questionId ?? null;
        draw();
      });

      new ResizeObserver(() => {
        send("pq:resize", { height: document.body.scrollHeight });
      }).observe(document.body);

      setInterval(draw, 1000);
      draw();
      send("pq:ready");
    </script>
  </body>
</html>
