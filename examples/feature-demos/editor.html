<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PQ-Trivia wizard</title>
    <link rel="stylesheet" href="../dist/v3/themes/paper.css" />
    <style>
      body {
        margin: 0;
        background: var(--pq-paper);
        color: var(--pq-ink);
        font-family: system-ui, sans-serif;
      }
      .pq-wizard-top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.5rem 1rem;
        padding: 1rem 1.5rem 0;
      }
      .pq-wizard-top h1 {
        margin: 0;
        font-size: 1.1rem;
        letter-spacing: 0.01em;
      }
      .pq-wizard-top p {
        margin: 0;
        font-size: 0.85rem;
        color: var(--pq-muted);
      }
    </style>
  </head>
  <body>
    <header class="pq-wizard-top">
      <h1>PQ-Trivia wizard</h1>
      <p>
        Build it first with <code>bun run build:editor</code>. Then write, give
        it a look, and press Save.
      </p>
    </header>
    <!-- The bundle mounts into this one element. Nothing else to wire. -->
    <div data-pq-wizard></div>
    <script type="module" src="../dist/v3/editor.js"></script>
  </body>
</html>
