name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/core/syntax/**"
      - "package.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run docs:reference
      - run: bun run docs:build
      - uses: actions/configure-pages@v5
        with:
          # Creates the Pages site when it does not exist yet. Existing sites
          # are left alone, so the source must be set to "GitHub Actions" by
          # hand: Pages otherwise builds `docs/` with Jekyll and every built
          # URL loses its `/pq-trivia/` prefix.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
