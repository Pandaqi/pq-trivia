name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # The tag and package.json must agree. No release from a wrong number.
      - name: Tag matches package.json
        run: |
          VERSION=$(bun -e "console.log((await Bun.file('package.json').json()).version)")
          test "v$VERSION" = "${GITHUB_REF_NAME}"

      # Checks, build (wizard and types), budgets, checksums. It never publishes.
      - run: bun run release:dry

      # Bun reads .npmrc, so the runner needs no npm. The token lives in the
      # repository secret and disappears with the runner.
      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > .npmrc
          bun publish --access public
          rm .npmrc

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/v3/*.js dist/v3/SHA256SUMS dist/v3/themes/*.css \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
